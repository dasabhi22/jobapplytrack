services:
  postgres:
    image: postgres:15
    container_name: jobapplytrack-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: applytrack
    ports:
      - "5432:5432"
    volumes:
      - jobapplytrack-data:/var/lib/postgresql/data
    networks:
      - jobapplytrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  frontend:
    build:
      context: ./frontend
    container_name: jobapplytrack-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - jobapplytrack-network
  
  backend:
    build:
      context: ./backend
    container_name: jobapplytrack-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      postgres: 
        condition: service_healthy

    networks:
      - jobapplytrack-network

networks:
  jobapplytrack-network:

volumes:
  jobapplytrack-data: